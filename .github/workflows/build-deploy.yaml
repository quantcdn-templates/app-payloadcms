name: Build and Push to Quant Cloud

on:
  push:
    branches:
      - main

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  QUANT_BASE_URL: ${{ vars.QUANT_BASE_URL || 'https://dashboard.quantcdn.io/api/v3' }}

jobs:
  build-and-push:
    runs-on: ${{ vars.RUNNER_TYPE || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize Quant Cloud
        uses: quantcdn/quant-cloud-init-action@v4
        id: init
        with:
          quant_organization: ${{ secrets.QUANT_ORGANIZATION }}
          quant_api_key: ${{ secrets.QUANT_API_KEY }}
          quant_application: ${{ vars.QUANT_APPLICATION || 'templates' }}
          environment_name_override: ${{ github.event.repository.name }}
          base_url: ${{ env.QUANT_BASE_URL }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ vars.BUILD_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.init.outputs.stripped_endpoint }}/${{ secrets.QUANT_ORGANIZATION }}/${{ steps.init.outputs.quant_application }}:app-${{ steps.init.outputs.image_suffix_clean }}
          cache-from: type=gha,scope=payloadcms
          cache-to: type=gha,mode=max,scope=payloadcms

      - name: Translate docker-compose for Quant Cloud
        uses: quantcdn/quant-cloud-compose-action@v1
        id: compose
        with:
          api_key: ${{ secrets.QUANT_API_KEY }}
          organization: ${{ secrets.QUANT_ORGANIZATION }}
          compose_file: docker-compose.yml
          image_suffix: ${{ steps.init.outputs.image_suffix_clean }}
          base_url: ${{ env.QUANT_BASE_URL }}

      - name: Create or update environment
        uses: quantcdn/quant-cloud-environment-action@v4
        with:
          api_key: ${{ secrets.QUANT_API_KEY }}
          organization: ${{ secrets.QUANT_ORGANIZATION }}
          app_name: ${{ steps.init.outputs.quant_application }}
          environment_name: ${{ steps.init.outputs.environment_name }}
          operation: ${{ steps.init.outputs.environment_exists == 'true' && 'update' || 'create' }}
          compose_spec: ${{ steps.compose.outputs.translated_compose }}
          base_url: ${{ env.QUANT_BASE_URL }}

      - name: Redeploy existing environment
        if: ${{ steps.init.outputs.environment_exists == 'true' }}
        uses: quantcdn/quant-cloud-environment-state-action@v4
        with:
          api_key: ${{ secrets.QUANT_API_KEY }}
          organization: ${{ secrets.QUANT_ORGANIZATION }}
          application: ${{ steps.init.outputs.quant_application }}
          environment: ${{ steps.init.outputs.environment_name }}
          action: redeploy
          base_url: ${{ env.QUANT_BASE_URL }}

      - name: Enable idle sleep
        env:
          QUANT_API_KEY: ${{ secrets.QUANT_API_KEY }}
          ORG: ${{ secrets.QUANT_ORGANIZATION }}
          APP: ${{ steps.init.outputs.quant_application }}
          ENVIRONMENT: ${{ steps.init.outputs.environment_name }}
        run: |
          URL="$QUANT_BASE_URL/organizations/$ORG/applications/$APP/environments/$ENVIRONMENT"
          AUTH="Authorization: Bearer $QUANT_API_KEY"

          # Environment creation is asynchronous. The record the idle-sleep
          # route binds to does not exist until creationStatus is completed.
          for i in $(seq 1 40); do
            STATUS=$(curl -s -H "$AUTH" "$URL" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("creationStatus",""))' 2>/dev/null || echo "")
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            echo "Waiting for environment ($i/40): creationStatus=${STATUS:-not found}"
            sleep 15
          done
          if [ "$STATUS" != "completed" ]; then
            echo "::error::Environment $ENVIRONMENT did not reach creationStatus=completed"
            exit 1
          fi

          # The record can answer 500 for a few seconds after creation
          # completes while the platform finishes wiring it up. Retry.
          for attempt in $(seq 1 6); do
            CODE=$(curl -s -o idle-sleep.json -w '%{http_code}' -X PUT -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d '{"enabled": true, "idleMinutes": 30}' "$URL/idle-sleep")
            if [ "$CODE" = "200" ]; then
              cat idle-sleep.json; echo
              exit 0
            fi
            echo "idle-sleep PUT returned HTTP $CODE (attempt $attempt/6)"
            sleep 15
          done
          echo "::error::Could not enable idle sleep on $ENVIRONMENT (last HTTP $CODE)"
          cat idle-sleep.json 2>/dev/null; echo
          exit 1

      - name: Provision template secrets
        env:
          QUANT_API_KEY: ${{ secrets.QUANT_API_KEY }}
          ORG: ${{ secrets.QUANT_ORGANIZATION }}
          APP: ${{ steps.init.outputs.quant_application }}
          ENVIRONMENT: ${{ steps.init.outputs.environment_name }}
        run: |
          # quant/meta.json may declare secrets the platform should generate,
          # e.g. {"name": "PAYLOAD_SECRET", "generate": "random", "length": 64}.
          # The portal does this for one-click deploys; do the same here so a
          # CI deploy starts with every generated secret present. Existing
          # values are never overwritten.
          URL="$QUANT_BASE_URL/organizations/$ORG/applications/$APP/environments/$ENVIRONMENT"
          AUTH="Authorization: Bearer $QUANT_API_KEY"
          WANTED=$(python3 - <<'PY'
          import json
          m = json.load(open("quant/meta.json"))
          m = m[0] if isinstance(m, list) else m
          for s in m.get("secrets", []):
              if s.get("generate") == "random":
                  print(s["name"], min(max(int(s.get("length", 64)), 16), 256))
          PY
          )
          if [ -z "$WANTED" ]; then
            echo "No generated secrets declared in quant/meta.json"
            exit 0
          fi
          EXISTING=$(curl -fsS -H "$AUTH" "$URL/variables" | python3 -c 'import sys,json; d=json.load(sys.stdin); d=d.get("environment", d) if isinstance(d, dict) else d; print(" ".join(v["name"] for v in d))')
          : > added-secrets.txt
          while read -r NAME LEN; do
            case " $EXISTING " in *" $NAME "*) echo "$NAME already set"; continue;; esac
            VALUE=$(openssl rand -base64 $((LEN * 2)) | tr -dc 'A-Za-z0-9' | head -c "$LEN")
            python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1]}))' "$VALUE" > var.json
            curl -fsS -o /dev/null -X PUT -H "$AUTH" -H "Content-Type: application/json" --data @var.json "$URL/variables/$NAME"
            rm -f var.json
            echo "Generated $NAME ($LEN chars)"
            echo "$NAME" >> added-secrets.txt
          done <<EOF
          $WANTED
          EOF
          if [ -s added-secrets.txt ]; then
            echo "Redeploying so the new secrets reach the running task"
            curl -fsS -o /dev/null -X PUT -H "$AUTH" -H "Content-Type: application/json" -d '{"action": "redeploy"}' "$URL/state"
          fi
